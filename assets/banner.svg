<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#061224"/>
    </linearGradient>

    <linearGradient id="chartGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="chartLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="80%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <radialGradient id="greenOrb" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueOrb" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .chart-wave {
        stroke-dasharray: 1200;
        stroke-dashoffset: 1200;
        animation: drawLine 4s ease-out forwards;
      }
      .pulse-orb {
        animation: pulseGlow 4s ease-in-out infinite alternate;
      }
      .float-node {
        animation: floatItem 3s ease-in-out infinite alternate;
      }
      .shimmer-pill {
        animation: shimmerBorder 3s infinite linear;
      }
      @keyframes drawLine {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.96); }
        100% { opacity: 0.7; transform: scale(1.04); }
      }
      @keyframes floatItem {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-5px); }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="280" rx="16" fill="url(#bgGrad)"/>
  <rect width="958" height="278" x="1" y="1" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Background Glowing Orbs (Dynamic Pulse) -->
  <g class="pulse-orb" style="transform-origin: center;">
    <circle cx="780" cy="90" r="140" fill="url(#greenOrb)"/>
    <circle cx="160" cy="200" r="160" fill="url(#blueOrb)"/>
  </g>

  <!-- Ambient Grid Patterns -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="320" y1="0" x2="320" y2="280"/>
    <line x1="440" y1="0" x2="440" y2="280"/>
    <line x1="560" y1="0" x2="560" y2="280"/>
    <line x1="680" y1="0" x2="680" y2="280"/>
    <line x1="800" y1="0" x2="800" y2="280"/>
    <line x1="0" y1="60" x2="960" y2="60"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
  </g>

  <!-- Dynamic Financial Trend Waves (Behind foreground text) -->
  <g opacity="0.45">
    <!-- Area under curve -->
    <path d="M 450 260 Q 550 210, 640 230 T 780 140 T 960 90 L 960 280 L 450 280 Z" fill="url(#chartGlow)" />
    <!-- Main animated trend line -->
    <path class="chart-wave" d="M 450 260 Q 550 210, 640 230 T 780 140 T 960 90" fill="none" stroke="url(#chartLine)" stroke-width="3" filter="url(#glow)"/>
    <!-- Secondary trend line -->
    <path class="chart-wave" style="animation-delay: 0.5s;" d="M 480 270 Q 580 230, 680 210 T 840 160 T 960 120" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  </g>

  <!-- Interactive Data Nodes on Chart (Dynamic Float) -->
  <g class="float-node">
    <circle cx="640" cy="230" r="4" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="780" cy="140" r="5" fill="#34D399" filter="url(#glow)"/>
    <circle cx="890" cy="108" r="4.5" fill="#60A5FA" filter="url(#glow)"/>
  </g>

  <!-- FOREGROUND CONTENT: Guarantees title & subtitle remain crisp and visible -->
  
  <!-- Top Category Tag / Pill -->
  <g transform="translate(50, 36)">
    <rect width="260" height="26" rx="13" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10B981"/>
    <text x="26" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">CURATED FINTECH &amp; BUDGETING</text>
  </g>

  <!-- Main Title -->
  <text x="50" y="106" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Awesome Personal Finance &amp; Budgeting
  </text>

  <!-- Subtitle -->
  <text x="50" y="142" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
    Curated Open-Source Software, Self-Hosted Stacks &amp; Leading SaaS Platforms
  </text>

  <!-- Core Highlights / Feature Badges -->
  <g transform="translate(50, 185)">
    <!-- Badge 1: Local-First -->
    <g transform="translate(0, 0)">
      <rect width="185" height="34" rx="8" fill="#132338" stroke="#1D4ED8" stroke-width="1" opacity="0.9"/>
      <text x="14" y="21" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Local-First &amp; Encrypted</text>
    </g>

    <!-- Badge 2: Envelope Budgeting -->
    <g transform="translate(197, 0)">
      <rect width="195" height="34" rx="8" fill="#0E2E28" stroke="#059669" stroke-width="1" opacity="0.9"/>
      <text x="14" y="21" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">✉️ Envelope &amp; Zero-Based</text>
    </g>

    <!-- Badge 3: Self-Hosted Docker -->
    <g transform="translate(404, 0)">
      <rect width="195" height="34" rx="8" fill="#241B3B" stroke="#7C3AED" stroke-width="1" opacity="0.9"/>
      <text x="14" y="21" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🐳 Self-Hosted &amp; Open Source</text>
    </g>

    <!-- Badge 4: Net Worth & Analytics -->
    <g transform="translate(611, 0)">
      <rect width="180" height="34" rx="8" fill="#2D2115" stroke="#D97706" stroke-width="1" opacity="0.9"/>
      <text x="14" y="21" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📈 Wealth &amp; Cash Flow</text>
    </g>
  </g>
</svg>